server.port=8085
logging.level.root=WARN
logging.level.org.springframework.web=WARN
logging.level.com.algo=INFO
spring.main.allow-bean-definition-overriding=true
spring.main.log-startup-info=true

# JSON Serialization: Ensure dates are ISO-8601 strings, not arrays
spring.jackson.serialization.write-dates-as-timestamps=false

# Optional: Disable automatic connection check on startup for Hikari
# spring.datasource.hikari.initialization-fail-timeout=-1

# -------------------------------------------------------
# Indicator Configuration
# -------------------------------------------------------

# Cascaded EMA periods (applied sequentially on price)
indicator.ema.period1=15
indicator.ema.cascade1=5
indicator.ema.cascade2=15
indicator.ema.cascade3=15
indicator.ema.cascade4=15
indicator.ema.cascade5=30

# SuperTrend 1 (MA Length 100) parameters
indicator.supertrend.maLength=21
indicator.supertrend.atrPeriod=10
indicator.supertrend.multiplier=0.5

# SuperTrend 2 (MA Length 42) parameters
indicator.supertrend2.maLength=42
indicator.supertrend2.atrPeriod=10
indicator.supertrend2.multiplier=0.5

trading.paper-mode=false
# Minimum ATR for valid trade signals (Prevents theta decay noise)
indicator.atr.threshold=0.15

