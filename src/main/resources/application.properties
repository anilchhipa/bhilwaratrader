server.port=8085
logging.level.root=WARN
logging.level.org.springframework.web=WARN
logging.level.com.algo=INFO
spring.main.allow-bean-definition-overriding=true
spring.main.log-startup-info=true

# JSON Serialization: Ensure dates are ISO-8601 strings, not arrays
spring.jackson.serialization.write-dates-as-timestamps=false

# Optional: Disable automatic connection check on startup for Hikari
# spring.datasource.hikari.initialization-fail-timeout=-1

# -------------------------------------------------------
# Indicator Configuration
# -------------------------------------------------------

# Cascaded EMA periods (applied sequentially on price)
indicator.ema.period1=15
indicator.ema.cascade1=5
indicator.ema.cascade2=15
indicator.ema.cascade3=15

# SuperTrend 1 (MA Length 100) parameters
indicator.supertrend.maLength=42
indicator.supertrend.atrPeriod=10
indicator.supertrend.multiplier=0.5

# SuperTrend 2 (MA Length 42) parameters
indicator.supertrend2.maLength=63
indicator.supertrend2.atrPeriod=10
indicator.supertrend2.multiplier=0.5

trading.paper-mode=false
# Minimum ATR for valid trade signals (Prevents theta decay noise)
indicator.atr.threshold=0.15

# -------------------------------------------------------
# UniRenko Overlay Configuration
# -------------------------------------------------------
# indicator.renko.type is no longer used. UniRenko and Traditional Renko run
# side-by-side. The UR button shows UniRenko; the Guppy panel uses Traditional.

# Initial trend brick size in index points (used before ATR warms up).
# For SENSEX futures a value of 75-150 works well depending on volatility.
indicator.renko.initialT=100.0

# Reversal factor — reversal costs (reversalFactor × T) points to flip direction.
# 2.0 means a reversal brick is twice the size of a trend brick (asymmetric UniRenko).
# Increase to 2.5-3.0 for a stronger noise filter; decrease to 1.5 for faster reaction.
indicator.renko.reversalFactor=2.0

# ATR multiplier — live brick size = ATR(3min) × atrMultiplier.
# Smaller value → finer bricks (more signals, more noise).
# Larger value → coarser bricks (fewer signals, higher conviction).
indicator.renko.atrMultiplier=0.3

indicator.renko.type=Traditional

# Pine Script Renko Block Sizes (Traditional mode for options)
indicator.renko1.blockSize=15.0
indicator.renko2.blockSize=50.0
indicator.renko3.blockSize=100.0

# -------------------------------------------------------
# Risk Management & Kill-Switch Settings
# -------------------------------------------------------
# Maximum allowed single order value (INR)
risk.max-order-value=200000.0

# Maximum cumulative daily loss (INR) before Kill-Switch fires
risk.max-daily-loss=50000.0

# Debounce time (ms) between identical rapid orders to prevent double execution
risk.order-debounce-ms=1500

# Enable automated MTM monitoring & Kill-Switch
risk.kill-switch-enabled=true

# -------------------------------------------------------
# Fail-Fast Limit Order Timeout
# -------------------------------------------------------
# How many seconds a limit order is allowed to stay OPEN before the watcher
# auto-cancels it. If the market hasn't touched your level in this time,
# the trade setup is considered stale.
# 30s = 1 candle worth of patience. Increase to 60s for wider setups.
risk.limit-order-ttl-seconds=30
