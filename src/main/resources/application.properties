server.port=8085
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.algo=DEBUG
spring.main.allow-bean-definition-overriding=true
spring.main.log-startup-info=true

# JSON Serialization: Ensure dates are ISO-8601 strings, not arrays
spring.jackson.serialization.write-dates-as-timestamps=false

# Optional: Disable automatic connection check on startup for Hikari
# spring.datasource.hikari.initialization-fail-timeout=-1

# -------------------------------------------------------
# Indicator Configuration
# -------------------------------------------------------

# Cascaded EMA periods (applied sequentially on price)
indicator.ema.period1=15
indicator.ema.cascade1=5
indicator.ema.cascade2=15
indicator.ema.cascade3=15
indicator.ema.cascade4=15
indicator.ema.cascade5=30

# MACD and related EMAs (EMA Fast & EMA Slow are used to build the MACD line)
indicator.ema.fast=50
indicator.ema.slow=100

# MACD Signal lines
indicator.macd.signal=5
indicator.macd.signal2=5

# Visibility (true to show MACD panel and internal EMA lines)
indicator.macd.show=false
indicator.macd.showEMAs=false

# SuperTrend parameters
indicator.supertrend.maLength=42
indicator.supertrend.atrPeriod=10
indicator.supertrend.multiplier=0.5
