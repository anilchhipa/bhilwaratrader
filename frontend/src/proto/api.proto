syntax = "proto3";

package com.algo.proto;

option java_package = "com.algo.proto";
option java_outer_classname = "ChartProtos";

message RenkoBrick {
    int64 t = 1;      // startTime
    int64 et = 2;     // endTime
    double o = 3;     // open
    double c = 4;     // close
}

message CandleUpdate {
    string symbol = 1;
    string timeframe = 2;
    CandleData candle = 3;
    repeated RenkoBrick renko = 4;
}

message CandleData {
    int64 t = 1;      // timestamp
    double o = 2;     // open
    double h = 3;     // high
    double l = 4;     // low
    double c = 5;     // close
    double v = 6;     // volume
    double d = 7;     // delta
    
    // Indicators
    double ema15 = 8;
    double ema15Plus5 = 9;
    double ema15Plus15 = 10;
    double ema15Plus15Plus15 = 11;
    double ema15Plus15Plus15Plus15 = 12;
    double ema15Plus15Plus15Plus15Plus30 = 13;
    
    // SuperTrend 1
    double stMa = 14;
    double stUp = 15;
    double stDn = 16;
    int32 stTrend = 17;
    
    // SuperTrend 2
    double stMa2 = 18;
    double stUp2 = 19;
    double stDn2 = 20;
    int32 stTrend2 = 21;
    int32 whaleSignal = 22;

    // Signal System
    int32 signal = 23;       // +1 BUY, -1 SELL, 0 NO TRADE
    double tradeScore = 24;  // Bayesian composite score (0.0–8.0)
    double er = 25;          // Efficiency Ratio (0.0–1.0)
}

message BatchCandleUpdate {
    repeated CandleUpdate updates = 1;
}
